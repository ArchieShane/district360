# 指标血缘：页面上每个数值读的是哪个库、哪张表、怎么算出来的。
# 前端鼠标悬浮在数值上时展示（GET /api/v1/lineage）。
#
# 占位符在运行时替换成实际配置：
#   {makani.db}          makani 源库名（取自 d360.datasource.makani.url，只显示库名）
#   {makani.district} 等 makani 源表全名（schema + 前缀 + 表名，取自 d360.makani.*）
#   {makani.medicalExclude}
#   {landuse.mapping}    土地利用归类规则（取自 d360.land-use.groups）
#   {stat.db}            统计库名（取自 d360.datasource.stat.url，只显示库名）
# 以冒号开头的参数在前端按当前选中的区替换：
#   :municipality        makani udm_district.municipalityname（ADM / AAM / WRM）
#   :makani_district_id  makani udm_district.districtid（跨市政重复，须与 :municipality 一起用）
#   :district_scope      统计范围 = 该区 makani 原始区面（EWKB）。宜居 / ADREC 都按这个范围做空间查询，
#                        不用各库自己的区 ID，保证三个库口径一致
#   :district_code       页面区编码
#
# implemented 由后端按「该源的抽取器是否已启用」自动判断：未启用的源显示为「计划口径」。
#
# sources.*.planned-db：只在该源「没有配置数据源 url」时作为提示里的库名显示；
#   配置了 d360.datasource.<源>.url 后，提示里自动显示 url 里的实际库名，这一项不起作用，部署时不用改。
#
# 字段对照表（docs/*.xlsx）只作参考：最终口径以与数据治理人员确认的为准，确认后把实际的取数方式和 SQL 写在这里。
d360:
  lineage:
    sources:
      makani:
        name-zh: makani
        name-en: makani
        planned-db: "makani_1119"
      liveability:
        name-zh: 宜居评估
        name-en: Liveability
        planned-db: "liveability_data_20260730"
      adrec:
        name-zh: ADREC
        name-en: ADREC
        planned-db: "待房地产组提供连接信息"

    metrics:
      # ---------------------------------------------------------------- makani · 区面
      area_km2:
        name-zh: 面积
        name-en: Area
        source: makani
        stat-column: stat_district_makani.area_km2
        source-tables: ["{makani.district}"]
        logic-zh: 区面投影到 UTM 40N（EPSG:32640）后求面积，÷ 1,000,000 换算成 km²，保留 3 位小数。
        logic-en: District polygon projected to UTM 40N (EPSG:32640), area ÷ 1,000,000 → km², 3 decimals.
        sql: |
          SELECT round((ST_Area(ST_Transform(shape, 32640)) / 1e6)::numeric, 3) AS area_km2
          FROM {makani.district}
          WHERE municipalityname = ':municipality'
            AND districtid = :makani_district_id

      municipality:
        name-zh: 所属市政
        name-en: Municipality
        source: makani
        stat-column: dim_district.municipality
        source-tables: ["{makani.district}"]
        logic-zh: 取区面所在记录的 municipalityname（ADM 阿布扎比市政 / AAM 艾因市政 / WRM 宰夫拉地区市政）。districtid 在不同市政之间会重复，所以区按「市政 + districtid」唯一确定。
        logic-en: municipalityname of the district record (ADM / AAM / WRM). districtid repeats across municipalities, so a district is identified by municipality + districtid.
        sql: |
          SELECT municipalityname
          FROM {makani.district}
          WHERE municipalityname = ':municipality'
            AND districtid = :makani_district_id

      communities:
        name-zh: 社区数
        name-en: Communities
        source: makani
        stat-column: stat_district_makani.communities
        source-tables: ["{makani.district}", "{makani.community}"]
        logic-zh: 社区面的中心点落在区面内即计入（按区面做空间汇总，不依赖社区表里的区字段）。
        logic-en: A community counts when its centroid falls inside the district polygon (spatial summary).
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.community} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      # ---------------------------------------------------------------- makani · 地块
      plots:
        name-zh: 地块数
        name-en: Plots
        source: makani
        stat-column: stat_district_makani.plots
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 地块中心点落在区面内即计入。数值以 makani 源表当前实际数据为准。
        logic-en: A plot counts when its centroid falls inside the district polygon. Reflects the current makani source table as is.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      plots_constructed:
        name-zh: 地块 · 已建成
        name-en: Plots · built
        source: makani
        stat-column: stat_district_makani.plots_constructed
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 区内地块中 construction_status = 'Constructed' 的数量。
        logic-en: Plots in the district with construction_status = 'Constructed'.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.construction_status = 'Constructed'

      plots_under_construction:
        name-zh: 地块 · 在建
        name-en: Plots · under construction
        source: makani
        stat-column: stat_district_makani.plots_under_construction
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 区内地块中 construction_status = 'Under Construction' 的数量。
        logic-en: Plots in the district with construction_status = 'Under Construction'.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.construction_status = 'Under Construction'

      plots_vacant_serviced:
        name-zh: 地块 · 空置·已通市政
        name-en: Plots · vacant, serviced
        source: makani
        stat-column: stat_district_makani.plots_vacant_serviced
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 区内地块中 construction_status = 'Not Constructed' 且 servicestatus = 'available' 的数量。
        logic-en: Plots with construction_status = 'Not Constructed' and servicestatus = 'available'.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.construction_status = 'Not Constructed'
            AND x.servicestatus = 'available'

      plots_vacant_unserviced:
        name-zh: 地块 · 空置·未通市政
        name-en: Plots · vacant, unserviced
        source: makani
        stat-column: stat_district_makani.plots_vacant_unserviced
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 区内地块中 construction_status = 'Not Constructed' 且 servicestatus 为 notAvailable / notAvailableHaveConsNOC 的数量（servicestatus = undefined 的不计入任何一类）。
        logic-en: Plots with construction_status = 'Not Constructed' and servicestatus in (notAvailable, notAvailableHaveConsNOC); 'undefined' is not counted in any class.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.construction_status = 'Not Constructed'
            AND x.servicestatus IN ('notAvailable', 'notAvailableHaveConsNOC')

      plot_built_rate:
        name-zh: 地块建成率
        name-en: Plot built rate
        source: makani
        stat-column: 接口计算：stat_district_makani.plots_constructed ÷ plots
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: 已建成地块数 ÷ 地块总数 × 100%，保留 1 位小数。
        logic-en: Built plots ÷ all plots × 100%, 1 decimal.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT round(100.0 * count(*) FILTER (WHERE x.construction_status = 'Constructed') / count(*), 1)
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      land_use:
        name-zh: 土地利用占比
        name-en: Land-use share
        source: makani
        stat-column: stat_district_landuse（区 × primaryuseengdesc 地块数），归类与占比在接口里计算
        source-tables: ["{makani.district}", "{makani.plot}"]
        logic-zh: "按地块主用途 primaryuseengdesc 分组计数，再按配置归为页面类别：{landuse.mapping}；未列出的用途（如 Investment、Utility、Industrial、Undefined）归入「公用与其他」。占比 = 该类地块数 ÷ 区内地块总数。面板显示：{landuse.highlight}。"
        logic-en: "Plots grouped by primaryuseengdesc, then mapped to page classes: {landuse.mapping}; unlisted uses (e.g. Investment, Utility, Industrial, Undefined) go to 'Utilities & other'. Share = class plots ÷ all plots in the district. Shown on the panel: {landuse.highlight}."
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT coalesce(nullif(trim(x.primaryuseengdesc), ''), 'Undefined') AS use_desc, count(*) AS plot_count
          FROM d JOIN {makani.plot} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          GROUP BY 1

      # ---------------------------------------------------------------- makani · 建筑
      buildings:
        name-zh: 建筑数
        name-en: Buildings
        source: makani
        stat-column: stat_district_makani.buildings
        source-tables: ["{makani.district}", "{makani.building}"]
        logic-zh: 建筑轮廓中心点落在区面内即计入（含 existing / underConstruction / abandoned）。
        logic-en: A building counts when its footprint centroid falls inside the district polygon (all physical statuses).
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.building} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      buildings_under_construction:
        name-zh: 在建建筑
        name-en: Buildings under construction
        source: makani
        stat-column: stat_district_makani.buildings_under_construction
        source-tables: ["{makani.district}", "{makani.building}"]
        logic-zh: 区内建筑中 physicalstatus 为 underConstruction / Under Construction 的数量。
        logic-en: Buildings in the district with physicalstatus underConstruction / Under Construction.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.building} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.physicalstatus IN ('underConstruction', 'Under Construction')

      # ---------------------------------------------------------------- makani · 公共设施
      schools:
        name-zh: 学校
        name-en: Schools
        source: makani
        stat-column: stat_district_makani.schools
        source-tables: ["{makani.district}", "{makani.school}"]
        logic-zh: ADEK 学校点位落在区面内即计入。
        logic-en: ADEK school points inside the district polygon.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.school} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      medical:
        name-zh: 医疗设施
        name-en: Health facilities
        source: makani
        stat-column: stat_district_makani.medical
        source-tables: ["{makani.district}", "{makani.doh}"]
        logic-zh: DOH 设施中 facility_category = 'Medical'、且英文名不匹配 {makani.medicalExclude}（去掉测试数据）的点位，落在区面内即计入。
        logic-en: DOH facilities with facility_category = 'Medical' whose English name does not match {makani.medicalExclude} (test records), inside the district polygon.
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.doh} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))
          WHERE x.facility_category = 'Medical'
            AND NOT (coalesce(x.facility_name_in_english, '') ILIKE ANY (ARRAY[{makani.medicalExcludeSql}]))

      mosques:
        name-zh: 清真寺
        name-en: Mosques
        source: makani
        stat-column: stat_district_makani.mosques
        source-tables: ["{makani.district}", "{makani.mosque}"]
        logic-zh: Awqaf 清真寺点位落在区面内即计入（全部清真寺）。
        logic-en: Awqaf mosque points inside the district polygon (all mosques).
        sql: |
          WITH d AS (SELECT shape FROM {makani.district}
                     WHERE municipalityname = ':municipality' AND districtid = :makani_district_id)
          SELECT count(*)
          FROM d JOIN {makani.mosque} x
            ON x.shape && d.shape AND ST_Intersects(d.shape, ST_Centroid(x.shape))

      # ---------------------------------------------------------------- Liveability
      liv_in_scope:
        name-zh: 宜居评估范围
        name-en: Liveability assessment scope
        source: liveability
        stat-column: stat_district_liveability.in_scope
        source-tables: ["dim_districts", "param_district_scope"]
        logic-zh: 按统计范围（makani 区面）在 dim_districts 里找重合面积最大的区，读宜居库配置表 param_district_scope 的 in_scope（没有配置行按 false）。false 时页面不展示宜居得分，公园指标照常展示。
        logic-en: Liveability district with the largest overlap with the scope (makani polygon); in_scope from the configuration table param_district_scope (false when no row). When false the scores are not shown; park figures still are.
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT coalesce((SELECT in_scope FROM param_district_scope
                           WHERE district_id = (SELECT district_id FROM l)), false)

      liv_current:
        name-zh: 宜居得分 · 目前
        name-en: Liveability · current
        source: liveability
        stat-column: stat_district_liveability.score_current
        source-tables: ["dim_calc_versions", "dim_districts", "fact_district_scores"]
        logic-zh: 按统计范围（makani 区面）在 dim_districts 里找重合面积最大的区，取该区 stage = Pipeline、当前发布版本（dim_calc_versions.current_flag = true）的 overall_score。不在宜居评估范围（param_district_scope.in_scope = false）的区不展示得分。
        logic-en: Find the Liveability district that overlaps the scope (makani polygon) most, then overall_score with stage = Pipeline, published calc version (dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT overall_score FROM fact_district_scores
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag) AND stage = 'Pipeline'

      liv_existing:
        name-zh: 宜居得分 · 现状
        name-en: Liveability · existing
        source: liveability
        stat-column: stat_district_liveability.score_existing
        source-tables: ["dim_calc_versions", "dim_districts", "fact_district_scores"]
        logic-zh: 按统计范围匹配 Liveability 的区（同上），取 stage = Existing、当前发布版本（dim_calc_versions.current_flag = true）的 overall_score。
        logic-en: Match the Liveability district by scope (as above), then overall_score with stage = Existing, published calc version (dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT overall_score FROM fact_district_scores
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag) AND stage = 'Existing'

      liv_target:
        name-zh: 宜居得分 · 目标
        name-en: Liveability · target
        source: liveability
        stat-column: stat_district_liveability.score_target
        source-tables: ["dim_calc_versions", "dim_districts", "fact_district_scores"]
        logic-zh: 按统计范围匹配 Liveability 的区（同上），取 stage = AP50、当前发布版本（dim_calc_versions.current_flag = true）的 overall_score。
        logic-en: Match the Liveability district by scope (as above), then overall_score with stage = AP50, published calc version (dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT overall_score FROM fact_district_scores
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag) AND stage = 'AP50'

      liv_gap:
        name-zh: 宜居得分 · 差距
        name-en: Liveability · gap
        source: liveability
        stat-column: 接口计算：max(0, score_target − score_current)
        source-tables: ["dim_calc_versions", "dim_districts", "fact_district_scores"]
        logic-zh: 目标（AP50）− 目前（Pipeline），小于 0 记 0；区按统计范围匹配（同上），取当前发布版本（dim_calc_versions.current_flag = true）。
        logic-en: Target (AP50) − current (Pipeline), floored at 0; district matched by scope (as above), published calc version (dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT greatest(0, max(overall_score) FILTER (WHERE stage = 'AP50')
                            - max(overall_score) FILTER (WHERE stage = 'Pipeline'))
          FROM fact_district_scores
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag)

      parks:
        name-zh: 公园数
        name-en: Parks
        source: liveability
        stat-column: stat_district_liveability.parks
        source-tables: ["fact_facilities"]
        logic-zh: 公园类设施（Park_Local / Park_Neighbourhoud / Park_District / Park_Other）只计 stage = Existing（Pipeline / AP50 / Ultimate 是规划增量，不计）。几何有点有面，统一取 ST_PointOnSurface（点取自身、面取面内一点）落在统计范围（makani 区面）内即计入，跨区的公园只计一次。与公园面积 existing_sqm 同一批公园。
        logic-en: Park facilities (Park_Local / Park_Neighbourhoud / Park_District / Park_Other) with stage = Existing only (Pipeline / AP50 / Ultimate are planned additions). Geometries are points or polygons; counted when ST_PointOnSurface(geom) falls inside the scope (makani polygon), so a park straddling a boundary is counted once. Same parks as existing_sqm in park area.
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g)  -- 统计范围 = makani 区面
          SELECT count(*) FROM fact_facilities f, s
          WHERE f.geom && s.g
            AND ST_Intersects(s.g, ST_PointOnSurface(f.geom))  -- 点取自身，面取面内一点
            AND f.stage = 'Existing'
            AND f.facility_type IN ('Park_Local', 'Park_Neighbourhoud', 'Park_District', 'Park_Other')

      park_area_ha:
        name-zh: 公园面积
        name-en: Park area
        source: liveability
        stat-column: stat_district_liveability.park_area_ha
        source-tables: ["dim_calc_versions", "dim_districts", "fact_parks_demand"]
        logic-zh: 按统计范围匹配 Liveability 的区（同上），existing_sqm ÷ 10,000 换算成公顷（当前发布版本，dim_calc_versions.current_flag = true）。
        logic-en: District matched by scope (as above); existing_sqm ÷ 10,000 → hectares (published calc version, dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT existing_sqm / 10000.0 FROM fact_parks_demand
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag)

      park_gap_ha:
        name-zh: 公园缺口
        name-en: Park gap
        source: liveability
        stat-column: stat_district_liveability.park_gap_ha
        source-tables: ["dim_calc_versions", "dim_districts", "fact_parks_demand"]
        logic-zh: 按统计范围匹配 Liveability 的区（同上），(area_required_sqm − existing_sqm) ÷ 10,000，小于 0 记 0（当前发布版本，dim_calc_versions.current_flag = true）。
        logic-en: District matched by scope (as above); (area_required_sqm − existing_sqm) ÷ 10,000, floored at 0 (published calc version, dim_calc_versions.current_flag = true).
        sql: |
          WITH s AS (SELECT ST_GeomFromEWKB(:district_scope) AS g),  -- 统计范围 = makani 区面
               l AS (SELECT d.district_id FROM dim_districts d, s
                     WHERE d.geom && s.g
                     ORDER BY ST_Area(ST_Intersection(d.geom, s.g)) DESC LIMIT 1)
          SELECT greatest(area_required_sqm - existing_sqm, 0) / 10000.0 FROM fact_parks_demand
          WHERE district_id = (SELECT district_id FROM l) AND calc_version_id = (SELECT calc_version_id FROM dim_calc_versions WHERE current_flag)

      re_sales:
        name-zh: 成交额（近 12 个月）
        name-en: Sales value (12 months)
        source: adrec
        stat-column: stat_district_adrec.sales_aed（页面 ÷ 10 亿显示为 bn）
        source-tables: ["ods.ods_re_x_q21_matview_sale"]
        logic-zh: 按合同日取迪拜时间最近 12 个完整自然月。成交点与 Makani 区面相交，去除完全相同的指标明细后，汇总物业行记录的分摊价（AED）。
        logic-en: Sum recorded allocated property-line prices in AED after exact metric-row deduplication. Use contract dates in the last 12 complete Dubai calendar months and intersect sale points with the district scope.
        sql: &adrec_sales_stats |
          WITH districts AS (
              SELECT refs.district_code,
                     ST_Transform(ST_GeomFromEWKB(decode(refs.scope_hex, 'hex')), :source_srid) AS geom
              FROM (VALUES
                      (:district_code::text, :district_scope::text)
              ) AS refs(district_code, scope_hex)
          )
          ,
          sale_lines AS (
              SELECT DISTINCT d.district_code, s.sale_application_id, s.sale_property_id, s.sale_contract_date,
                     s.sale_property_share, s.longitude, s.latitude,
                     s.sale_property_price_aed, s.property_sold_area_sqm, s.property_sale_rate_aed_sqm
              FROM ods.ods_re_x_q21_matview_sale AS s
              JOIN districts AS d
                ON s.longitude BETWEEN ST_XMin(d.geom) AND ST_XMax(d.geom)
               AND s.latitude BETWEEN ST_YMin(d.geom) AND ST_YMax(d.geom)
               AND ST_Intersects(d.geom, ST_SetSRID(ST_MakePoint(s.longitude, s.latitude), :source_srid))
              WHERE s.sale_contract_date >= :previous_start_date
                AND s.sale_contract_date < :period_end_next_date
                AND s.longitude::text NOT IN ('NaN', 'Infinity', '-Infinity')
                AND s.latitude::text NOT IN ('NaN', 'Infinity', '-Infinity')
          )
          , metric_lines AS (
              SELECT district_code, sale_application_id,
                     sale_contract_date >= :period_start_date AS in_current_period,
                     CASE WHEN sale_property_price_aed::text NOT IN ('NaN', 'Infinity', '-Infinity')
                          THEN sale_property_price_aed END AS amount_aed,
                     CASE WHEN property_sold_area_sqm > 0
                                AND property_sold_area_sqm::text NOT IN ('NaN', 'Infinity', '-Infinity')
                          THEN property_sold_area_sqm END AS area_sqm,
                     CASE WHEN property_sale_rate_aed_sqm::text NOT IN ('NaN', 'Infinity', '-Infinity')
                          THEN property_sale_rate_aed_sqm END AS rate_aed_sqm
              FROM sale_lines
          )
          SELECT district_code,
                 SUM(amount_aed) FILTER (WHERE in_current_period) AS sales_aed,
                 SUM(amount_aed) FILTER (WHERE NOT in_current_period) AS previous_sales_aed,
                 NULLIF(COUNT(DISTINCT sale_application_id) FILTER (WHERE in_current_period), 0)::int
                     AS transactions,
                 CASE WHEN COUNT(*) FILTER (
                                 WHERE in_current_period AND (area_sqm IS NULL OR rate_aed_sqm IS NULL)
                             ) = 0
                      THEN SUM(rate_aed_sqm * area_sqm) FILTER (WHERE in_current_period)
                           / NULLIF(SUM(area_sqm) FILTER (WHERE in_current_period), 0)
                 END AS avg_price_sqm
          FROM metric_lines
          GROUP BY district_code

      re_yoy:
        name-zh: 成交额同比
        name-en: Sales YoY
        source: adrec
        stat-column: stat_district_adrec.sales_yoy_pct
        source-tables: ["ods.ods_re_x_q21_matview_sale"]
        logic-zh: 同一查询返回前后两个连续 12 个月的成交额。抽取器计算（本期 − 基期）÷ 基期 × 100，任一期缺失或为零时返回数据缺失。
        logic-en: The query returns recorded sales amounts for consecutive 12-month periods. The extractor computes 100 × (current − previous) ÷ previous. A missing or zero amount in either period yields missing data.
        sql: *adrec_sales_stats

      re_transactions:
        name-zh: 成交宗数
        name-en: Transactions
        source: adrec
        stat-column: stat_district_adrec.transactions
        source-tables: ["ods.ods_re_x_q21_matview_sale"]
        logic-zh: 近 12 个完整月按合同日归期，每区统计不同的销售申请。一个申请有物业落在多个区时，各对应区分别计数。
        logic-en: Count distinct sales applications per Makani district over the last 12 complete months by contract date. An application with properties in multiple districts contributes to each corresponding district.
        sql: *adrec_sales_stats

      re_mortgages:
        name-zh: 按揭
        name-en: Mortgages
        source: adrec
        stat-column: stat_district_adrec.mortgages
        source-tables: ["ods.ods_re_x_q21_matview_mortgage"]
        logic-zh: 按起始日取最近 12 个完整月。按揭物业点与 Makani 区面相交，对有登记、解押或变更记录的按揭合同参考号按区去重计数。
        logic-en: Count distinct contract references per district for registration, release or change records with a mortgage start date in the last 12 complete months. Intersect mortgage property points with the district scope.
        sql: |
          WITH districts AS (
                  SELECT refs.district_code,
                         ST_Transform(ST_GeomFromEWKB(decode(refs.scope_hex, 'hex')), :source_srid) AS geom
                  FROM (VALUES
                          (:district_code::text, :district_scope::text)
                  ) AS refs(district_code, scope_hex)
              )
          ,
              mortgage_points AS (
                  SELECT m.orientational_mortgage_contract_id AS contract_id,
              CASE
                  WHEN m.longitude::double precision > '-Infinity'::double precision
                   AND m.longitude::double precision < 'Infinity'::double precision
                   AND m.latitude::double precision > '-Infinity'::double precision
                   AND m.latitude::double precision < 'Infinity'::double precision
                   AND (:source_srid <> 4326 OR
                        (m.longitude BETWEEN -180 AND 180 AND m.latitude BETWEEN -90 AND 90))
                      THEN ST_SetSRID(ST_MakePoint(m.longitude, m.latitude), :source_srid)
              END
           AS point
                  FROM ods.ods_re_x_q21_matview_mortgage m
                  WHERE m.mortgage_start_date >= :period_start_date
                    AND m.mortgage_start_date < :period_end_next_date
                    AND LOWER(BTRIM(m.mortgage_application_type)) IN ('registration', 'release', 'change')
                    AND m.orientational_mortgage_contract_id IS NOT NULL
              )
              SELECT d.district_code, COUNT(DISTINCT m.contract_id)::integer AS count
              FROM mortgage_points m
              JOIN districts d ON ST_Intersects(d.geom, m.point)
              GROUP BY d.district_code

      re_price:
        name-zh: 均价 AED/m²
        name-en: Average price AED/m²
        source: adrec
        stat-column: stat_district_adrec.avg_price_sqm
        source-tables: ["ods.ods_re_x_q21_matview_sale"]
        logic-zh: 近 12 个完整月的成交记录按成交面积加权。土地及其他物业合算。任一纳入的记录缺有效面积或源单价时，对应区均价返回数据缺失。
        logic-en: Weight the reported unit prices by sold area over the last 12 complete months. Include land and other property types together. A missing or invalid sold area or unit price on any included row yields missing data for the district.
        sql: *adrec_sales_stats

      re_leases:
        name-zh: 在册租约
        name-en: Active leases
        source: adrec
        stat-column: stat_district_adrec.active_leases
        source-tables: ["ods.ods_re_x_q21_matview_rent"]
        logic-zh: 纳入 Tawtheeq 和 ADGM。按最新租赁入库快照日，筛选最新状态为 active、起止日覆盖统计日、截至统计日未取消或终止的合同。使用最新物业位置与区面相交，按区对来源和合同号的组合去重。
        logic-en: Include Tawtheeq and ADGM. At the latest rental ingestion date, require latest status active, a term covering that date, and no effective cancellation or termination. Intersect latest property positions with the district and count distinct source and contract-number pairs.
        sql: |
          -- :rent_snapshot_date is the date of the latest finite _ingested_at across Tawtheeq and ADGM.
          WITH districts AS (
                  SELECT refs.district_code,
                         ST_Transform(ST_GeomFromEWKB(decode(refs.scope_hex, 'hex')), :source_srid) AS geom
                  FROM (VALUES
                          (:district_code::text, :district_scope::text)
                  ) AS refs(district_code, scope_hex)
              )
          ,
              rent_rows AS (
                  SELECT LOWER(BTRIM(r.rent_application_source_system)) AS source_system,
                         BTRIM(r.rent_contract_number) AS contract_number,
                         COALESCE(r.rent_property_id, r.property_id) AS property_id,
                         r.latitude,
                         r.longitude,
                         LOWER(BTRIM(r.rent_contract_current_status)) AS status,
              CASE
                  WHEN pg_typeof(r.rent_start_date) = 'timestamptz'::regtype
                      THEN (r.rent_start_date AT TIME ZONE 'Asia/Dubai')::date
                  ELSE r.rent_start_date::date
              END
                             AS start_date,
              CASE
                  WHEN pg_typeof(r.rent_end_date) = 'timestamptz'::regtype
                      THEN (r.rent_end_date AT TIME ZONE 'Asia/Dubai')::date
                  ELSE r.rent_end_date::date
              END
                             AS end_date,
              CASE
                  WHEN pg_typeof(r.rent_cancelation_termination_date) = 'timestamptz'::regtype
                      THEN (r.rent_cancelation_termination_date AT TIME ZONE 'Asia/Dubai')::date
                  ELSE r.rent_cancelation_termination_date::date
              END
                             AS cancellation_date,
                         CASE WHEN isfinite(r._ingested_at) THEN r._ingested_at END AS loaded_at,
                         CASE WHEN isfinite(r.trs_moye_input_time) THEN r.trs_moye_input_time END AS input_time,
                         r.rent_application_date AS application_date
                  FROM ods.ods_re_x_q21_matview_rent r
                  WHERE LOWER(BTRIM(r.rent_application_source_system)) IN ('tawtheeq', 'adgm')
                    AND NULLIF(BTRIM(r.rent_contract_number), '') IS NOT NULL
              ),
              versioned AS (
                  SELECT r.*,
                         DENSE_RANK() OVER (
                             PARTITION BY source_system, contract_number
                             ORDER BY loaded_at DESC NULLS LAST, input_time DESC NULLS LAST, application_date DESC NULLS LAST
                         ) AS contract_version,
                         DENSE_RANK() OVER (
                             PARTITION BY source_system, contract_number, property_id,
                                          CASE WHEN property_id IS NULL THEN latitude END,
                                          CASE WHEN property_id IS NULL THEN longitude END
                             ORDER BY loaded_at DESC NULLS LAST, input_time DESC NULLS LAST, application_date DESC NULLS LAST
                         ) AS property_version
                  FROM rent_rows r
              ),
              contract_status AS (
                  SELECT source_system, contract_number,
                         BOOL_AND(COALESCE(
                             status = 'active'
                             AND isfinite(start_date) AND start_date <= :rent_snapshot_date
                             AND isfinite(end_date) AND end_date >= :rent_snapshot_date
                             AND (cancellation_date IS NULL OR cancellation_date > :rent_snapshot_date), false
                         )) AS active
                  FROM versioned
                  WHERE contract_version = 1
                  GROUP BY source_system, contract_number
              ),
              property_points AS (
                  SELECT r.source_system, r.contract_number,
              CASE
                  WHEN r.longitude::double precision > '-Infinity'::double precision
                   AND r.longitude::double precision < 'Infinity'::double precision
                   AND r.latitude::double precision > '-Infinity'::double precision
                   AND r.latitude::double precision < 'Infinity'::double precision
                   AND (:source_srid <> 4326 OR
                        (r.longitude BETWEEN -180 AND 180 AND r.latitude BETWEEN -90 AND 90))
                      THEN ST_SetSRID(ST_MakePoint(r.longitude, r.latitude), :source_srid)
              END
           AS point
                  FROM versioned r
                  WHERE property_version = 1
              )
              SELECT d.district_code,
                     (COUNT(DISTINCT (r.source_system, r.contract_number)) FILTER (WHERE c.active))::integer AS count
              FROM property_points r
              JOIN districts d ON ST_Intersects(d.geom, r.point)
              JOIN contract_status c USING (source_system, contract_number)
              GROUP BY d.district_code

      re_monthly:
        name-zh: 月度成交宗数
        name-en: Monthly transactions
        source: adrec
        stat-column: stat_district_adrec_monthly.transactions
        source-tables: ["ods.ods_re_x_q21_matview_sale"]
        logic-zh: 近 12 个完整月按合同日期所在月和 Makani 区去重统计销售申请。缺数据或宗数为零的月份没有结果行。
        logic-en: Count distinct sales applications by contract month and Makani district over the last 12 complete months. Omit months with missing observations or zero transactions.
        sql: |
          WITH districts AS (
              SELECT refs.district_code,
                     ST_Transform(ST_GeomFromEWKB(decode(refs.scope_hex, 'hex')), :source_srid) AS geom
              FROM (VALUES
                      (:district_code::text, :district_scope::text)
              ) AS refs(district_code, scope_hex)
          )
          ,
          sale_lines AS (
              SELECT DISTINCT d.district_code, s.sale_application_id, s.sale_property_id, s.sale_contract_date,
                     s.sale_property_share, s.longitude, s.latitude,
                     s.sale_property_price_aed, s.property_sold_area_sqm, s.property_sale_rate_aed_sqm
              FROM ods.ods_re_x_q21_matview_sale AS s
              JOIN districts AS d
                ON s.longitude BETWEEN ST_XMin(d.geom) AND ST_XMax(d.geom)
               AND s.latitude BETWEEN ST_YMin(d.geom) AND ST_YMax(d.geom)
               AND ST_Intersects(d.geom, ST_SetSRID(ST_MakePoint(s.longitude, s.latitude), :source_srid))
              WHERE s.sale_contract_date >= :previous_start_date
                AND s.sale_contract_date < :period_end_next_date
                AND s.longitude::text NOT IN ('NaN', 'Infinity', '-Infinity')
                AND s.latitude::text NOT IN ('NaN', 'Infinity', '-Infinity')
          )
          SELECT district_code, DATE_TRUNC('month', sale_contract_date)::date AS month,
                 COUNT(DISTINCT sale_application_id)::int AS transactions
          FROM sale_lines
          WHERE sale_contract_date >= :period_start_date
            AND sale_application_id IS NOT NULL
          GROUP BY 1, 2
          ORDER BY 1, 2

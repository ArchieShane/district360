server:
  port: ${D360_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/geo+json,application/x-protobuf

spring:
  application:
    name: district360
  profiles:
    default: local
  config:
    import:
      - classpath:district-dictionary.yml
      - classpath:metric-lineage.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  flyway:
    schemas: stat
    default-schema: stat
    create-schemas: true
    locations: classpath:db/migration

d360:
  datasource:
    # 统计库：接口唯一的数据源
    stat:
      url: ${D360_STAT_DB_URL:jdbc:postgresql://10.255.254.109:5443/district360?currentSchema=stat,public}
      username: ${D360_STAT_DB_USER:}
      password: ${D360_STAT_DB_PASSWORD:}
    # makani 源库：只给 MakaniExtractor 用
    makani:
      url: ${D360_MAKANI_DB_URL:jdbc:postgresql://10.255.254.109:5443/makani_1119}
      username: ${D360_MAKANI_DB_USER:}
      password: ${D360_MAKANI_DB_PASSWORD:}
    # 宜居 / ADREC：配置 url 后对应模块才启用（见 application-local.example.yml）

  makani:
    schema: ods
    table-prefix: ods_makani_
    municipality: ADM
    boundary-simplify-tolerance: 0.00003
    medical-exclude-name-patterns: ["%test%"]

  etl:
    enabled: ${D360_ETL_ENABLED:true}
    cron: "0 0 3 * * *"
    zone: Asia/Dubai
    # 启动时如果 makani 统计表还是空的，后台跑一次 makani 抽取
    run-makani-on-startup-if-empty: true

  admin:
    # 手动触发抽取的口令（请求头 X-Admin-Token）；为空则禁用该接口
    token: ${D360_ADMIN_TOKEN:}

  # 土地利用归类：makani udm_plot.primaryuseengdesc → 页面类别（顺序即页面顺序，页面显示前 3 类）
  # TODO: 「混合」的归类规则待产品确认，目前暂按 Investment 计入
  land-use:
    groups:
      - { key: residential, name-zh: 居住,     name-en: Residential,         uses: [Residential] }
      - { key: commercial,  name-zh: 商业,     name-en: Commercial,          uses: [Commercial] }
      - { key: mixed,       name-zh: 混合,     name-en: Mixed use,           uses: [Investment] }
      - { key: community,   name-zh: 社区设施, name-en: Community,           uses: [Educational, Health, Religious, Public, Governmental, Cultural, Diplomatic] }
      - { key: open_space,  name-zh: 开放空间, name-en: Open space,          uses: [Recreational] }
      - { key: other,       name-zh: 公用与其他, name-en: Utilities & other, uses: [] }

logging:
  level:
    com.district360: INFO

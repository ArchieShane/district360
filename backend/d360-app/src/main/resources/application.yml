server:
  port: ${D360_PORT:8080}
  # 二级路由（如 /district360）：本地开发为空；Docker 镜像默认 /district360，用环境变量 D360_CONTEXT_PATH 改
  servlet:
    context-path: ${D360_CONTEXT_PATH:}
  # 前面有 Nginx 等反向代理时，按 X-Forwarded-* 生成重定向地址
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/geo+json,application/x-protobuf,text/html,text/css,text/javascript,application/javascript,image/svg+xml

spring:
  application:
    name: district360
  profiles:
    default: local
  config:
    import:
      - classpath:metric-lineage.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  # 前端页面（frontend/dist）：本地开发由 Vite 提供，不用管；Docker 里由后端同端口托管，
  # 镜像设置 D360_STATIC_LOCATIONS=file:/app/static/（宿主机映射目录）
  web:
    resources:
      static-locations: ${D360_STATIC_LOCATIONS:classpath:/static/}
      cache:
        cachecontrol:
          no-cache: true   # 每次向服务器确认是否有更新（未变返回 304），前端更新后不用强刷
  flyway:
    schemas: stat
    default-schema: stat
    create-schemas: true
    locations: classpath:db/migration

d360:
  datasource:
    # 统计库：接口唯一的数据源
    stat:
      url: ${D360_STAT_DB_URL:jdbc:postgresql://10.255.254.101:15432/district360?currentSchema=stat,public}
      username: ${D360_STAT_DB_USER:}
      password: ${D360_STAT_DB_PASSWORD:}
    # makani 源库：只给 MakaniExtractor 用
    makani:
      url: ${D360_MAKANI_DB_URL:jdbc:postgresql://10.255.254.111:15432/makani_1119}
      username: ${D360_MAKANI_DB_USER:}
      password: ${D360_MAKANI_DB_PASSWORD:}
    # 宜居 / ADREC：配置 url 后对应模块才启用（见 application-local.example.yml）

  # makani 源表位置：表全名 = <schema>.<table-prefix><表名>，例如 ods.ods_makani_udm_district
  #   数据治理库 makani_1119      ：schema = ods，    table-prefix = ods_makani_
  #   全量库 makani_sync_full / 生产：schema = public，table-prefix = ""（留空）
  # 也可以用环境变量 D360_MAKANI_SCHEMA / D360_MAKANI_TABLE_PREFIX 覆盖；改完重启后端即生效，
  # 指标悬浮提示里的库名、表名会跟着变。
  makani:
    schema: ${D360_MAKANI_SCHEMA:ods}
    table-prefix: ${D360_MAKANI_TABLE_PREFIX:ods_makani_}
    boundary-simplify-tolerance: 0.00003
    medical-exclude-name-patterns: ["%test%"]

  etl:
    enabled: ${D360_ETL_ENABLED:true}
    cron: "0 0 3 * * *"
    zone: Asia/Dubai
    # 启动时如果 makani 统计表还是空的，后台跑一次 makani 抽取
    run-makani-on-startup-if-empty: true

  admin:
    # 手动触发抽取的口令（请求头 X-Admin-Token）；为空则禁用该接口
    token: ${D360_ADMIN_TOKEN:}

  # 土地利用归类：makani udm_plot.primaryuseengdesc → 页面类别
  # - 顺序即页面顺序；没被任何一组列出的用途（如 Investment、Utility、Industrial、Undefined）归入最后一组
  # - highlight: true 的类别显示在面板「土地利用」一行（目前只显示居住、商业；「混合」已按业务要求删除）
  land-use:
    groups:
      - { key: residential, name-zh: 居住,       name-en: Residential,       highlight: true, uses: [Residential] }
      - { key: commercial,  name-zh: 商业,       name-en: Commercial,        highlight: true, uses: [Commercial] }
      - { key: community,   name-zh: 社区设施,   name-en: Community,         uses: [Educational, Health, Religious, Public, Governmental, Cultural, Diplomatic] }
      - { key: open_space,  name-zh: 开放空间,   name-en: Open space,        uses: [Recreational] }
      - { key: other,       name-zh: 公用与其他, name-en: Utilities & other, uses: [] }

logging:
  level:
    com.district360: INFO

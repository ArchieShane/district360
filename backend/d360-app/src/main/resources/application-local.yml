# 本地开发配置（随代码提交，连内网开发库）。
#
# 统计库（district360）：接口唯一读取的库，抽取结果写在这里。
#   2026-11-21 起从 109 迁到 101：109 存在硬件导致的数据损坏，大批量写入时数据库会崩溃恢复。
#   首次使用新库前需要先建库并安装 PostGIS（建表由 Flyway 在后端启动时自动完成）：
#     CREATE DATABASE district360;  然后在 district360 里执行  CREATE EXTENSION IF NOT EXISTS postgis;
#
# makani / 宜居源库：2026-11-22 起从 109 切到 10.255.254.111:15432（109 硬件损坏，库已迁到 111 并修复，账号与 109 相同）。
#   makani 仍用全量库 makani_sync_full；
#   要改用 makani_1119（同在 111 上），把 makani 的 url、schema、table-prefix 三项一起改。
d360:
  datasource:
    stat:
      url: jdbc:postgresql://10.255.254.101:15432/district360?currentSchema=stat,public
      username: postgres
      password: "postgres"
    makani:
      url: jdbc:postgresql://10.255.254.111:15432/makani_sync_full
      username: postgres
      password: "freedo"
    liveability:
      url: jdbc:postgresql://10.255.254.111:15432/liveability_data_20260730
      username: postgres
      password: "freedo"
    # ODS 源库（V1.0 主题库：空间下钻等），d360-ods 抽取器读它，写统计库同库的 theme schema。
    #   2026-11-25 起用 mock 库 makani_1119（ods schema，表名 ods_makani_*）：区域 216、社区 1864、地块 41 万、
    #   建筑 38.3 万、BDMS 楼层 52.4 万、单元 72.8 万（地块、单元表 11-25 重新导入为全量；市政用 uae_all_municipalities）。
    #   原 pop 库建筑、楼层表为空，换回时只改 url。
    #   本地后端请关闭定时抽取（D360_ETL_ENABLED=false），避免与 109 线上每晚同时写同一个库。
    ods:
      url: jdbc:postgresql://10.255.254.111:15432/makani_1119?currentSchema=ods,public
      username: postgres
      password: "freedo"
    # ADREC 源库为只读。配置 URL 后启用抽取，坐标 SRID 以源方确认值为准。
    # 对应环境变量为 D360_DATASOURCE_ADREC_URL、D360_DATASOURCE_ADREC_USERNAME、
    # D360_DATASOURCE_ADREC_PASSWORD 和 D360_DATASOURCE_ADREC_SOURCESRID。
    # adrec:
    #   url: ${D360_DATASOURCE_ADREC_URL}
    #   username: ${D360_DATASOURCE_ADREC_USERNAME}
    #   password: ${D360_DATASOURCE_ADREC_PASSWORD}
    #   source-srid: ${D360_DATASOURCE_ADREC_SOURCESRID}
  makani:
    schema: public
    table-prefix: ""
  admin:
    token: "local-dev-token"

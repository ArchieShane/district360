# District 360 生产配置（映射到容器 /app/config/application-prod.yml，改完重启容器生效：docker restart district360）
# 这里只写需要覆盖的项，其余默认值见 jar 内的 application.yml。
# 端口、二级路由、JVM 内存不在这里改，改部署目录下的 .env。

d360:
  datasource:
    # 统计库：接口唯一读取的库，抽取结果写在这里（PostgreSQL + PostGIS）。
    # 首次使用先建库并装 PostGIS：CREATE DATABASE district360;  再在库里 CREATE EXTENSION IF NOT EXISTS postgis;
    # 表由 Flyway 在后端启动时自动创建（stat schema）。
    stat:
      url: jdbc:postgresql://<统计库IP>:<端口>/district360?currentSchema=stat,public
      username: <用户名>
      password: "<密码>"

    # makani 源库：只给 makani 抽取用
    makani:
      url: jdbc:postgresql://<makani库IP>:<端口>/<makani库名>
      username: <用户名>
      password: "<密码>"

    # 宜居源库（宜居抽取用，只读）
    liveability:
      url: jdbc:postgresql://<宜居库IP>:<端口>/<宜居库名>
      username: <用户名>
      password: "<密码>"

    # ADREC 源库（房地产抽取用，只读；表在 ods schema：ods_re_x_q21_matview_sale / mortgage / rent）
    # source-srid：源表 longitude / latitude 的坐标系，以数据提供方确认的为准（经纬度一般是 4326）
    adrec:
      url: jdbc:postgresql://<ADREC库IP>:<端口>/<ADREC库名>
      username: <用户名>
      password: "<密码>"
      source-srid: 4326

    # ODS 源库（V1.0 主题库抽取用，只读；d360-ods 模块）。配置 url 后才启用 ods-spatial 等抽取器，
    # 结果写统计库同一个库里的 theme schema（空间下钻 sp_* 等表，由 Flyway 创建）。
    # 手动触发：POST /api/v1/admin/etl/ods-spatial；全量约 160 万行，单事务写入。
    ods:
      url: jdbc:postgresql://<ODS库IP>:<端口>/<ODS库名>
      username: <用户名>
      password: "<密码>"

  # ODS 源表位置：表全名 = <schema>.<table-prefix><表名>，例如 ods.ods_makani_udm_district
  ods:
    schema: ods
    table-prefix: ods_

  # makani 源表位置：表全名 = <schema>.<table-prefix><表名>
  #   全量库 makani_sync_full / 生产库：schema = public，table-prefix = ""
  #   数据治理库 makani_1119          ：schema = ods，   table-prefix = ods_makani_
  makani:
    schema: public
    table-prefix: ""

  etl:
    # 每天 03:00（迪拜时间）自动抽取；统计表为空时启动后自动跑一次 makani 抽取（约 2.5 分钟）
    enabled: true

  admin:
    # 手动触发抽取的口令（请求头 X-Admin-Token）；留空则禁用手动触发接口
    # 例：curl -X POST -H "X-Admin-Token: <口令>" http://<服务器>:<端口>/district360/api/v1/admin/etl/all
    token: ""

logging:
  file:
    name: /app/logs/district360.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
